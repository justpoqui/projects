# Builds Scrapfall (shooter/) and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://<owner>.github.io/<repo>/
name: Publish Scrapfall

on:
  push:
    branches: [3d-shooter]
    paths: ['shooter/**', '.github/workflows/shooter-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shooter-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shooter/package-lock.json
      - name: Build
        working-directory: shooter
        run: |
          npm ci
          npm run build
      - name: Push to gh-pages
        working-directory: shooter/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Scrapfall from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
